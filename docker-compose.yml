# ============================================================
# BHUMI BLOCKCHAIN PLATFORM — Docker Compose
# ============================================================
# Setiap laptop menjalankan file ini dengan .env yang berbeda:
#   cp .env.laptop1 .env && docker compose up -d    (Gilang)
#   cp .env.laptop2 .env && docker compose up -d    (Arin)
#   cp .env.laptop3 .env && docker compose up -d    (Ihab)
#
# Untuk deploy contract (hanya sekali, di laptop Gilang):
#   docker compose --profile deploy up deployer
#
# Untuk supabase indexer (opsional, di laptop manapun):
#   docker compose --profile indexer up -d supabase-indexer
# ============================================================

services:

  # ═══════════════════════════════════════════════════════════
  #  BLOCKCHAIN — Hyperledger Besu IBFT 2.0 Validator Node
  # ═══════════════════════════════════════════════════════════
  besu-node:
    image: hyperledger/besu:24.1.2
    container_name: bhumi-besu-${NODE_NAME:-node}
    user: root
    restart: unless-stopped
    ports:
      - "8545:8545"       # JSON-RPC HTTP
      - "8546:8546"       # WebSocket
      - "30303:30303"     # P2P TCP
      - "30303:30303/udp" # P2P UDP
    volumes:
      - besu-data:/opt/besu/data
      - ./blockchain/genesis.json:/opt/besu/genesis.json:ro
      - ./docker/node-keys/${NODE_KEY_FILE:-node.key}:/opt/besu/node.key:ro
    environment:
      - BESU_OPTS=-Xmx2g
    entrypoint: /opt/besu/bin/besu
    command: >-
      --data-path=/opt/besu/data
      --genesis-file=/opt/besu/genesis.json
      --node-private-key-file=/opt/besu/node.key
      --rpc-http-enabled=true
      --rpc-http-api=ETH,NET,IBFT,ADMIN,DEBUG,WEB3
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-cors-origins=*
      --host-allowlist=*
      --rpc-ws-enabled=true
      --rpc-ws-host=0.0.0.0
      --rpc-ws-port=8546
      --p2p-host=0.0.0.0
      --p2p-port=30303
      --nat-method=NONE
      --min-gas-price=0
      --bootnodes=${BOOTNODES}
      --logging=INFO
    networks:
      - bhumi-net
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8545"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s




  # ═══════════════════════════════════════════════════════════
  #  STORAGE SYNC — Download IPFS Files to Local Storage
  # ═══════════════════════════════════════════════════════════
  storage-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile.services
    container_name: bhumi-storage-sync
    restart: unless-stopped
    command: ["node", "bhumi-storage-sync.js"]
    environment:
      - RPC_URL=http://besu-node:8545
      - CONTRACT_ABI_PATH=/app/contracts/LandRegistry.json
    volumes:
      - storage-data:/bhumi-data/storage
    depends_on:
      besu-node:
        condition: service_started
    networks:
      - bhumi-net

  # ═══════════════════════════════════════════════════════════
  #  SUPABASE INDEXER — Index Blockchain Data to Supabase
  #  (Opsional — jalankan dengan: docker compose --profile indexer up -d)
  # ═══════════════════════════════════════════════════════════
  supabase-indexer:
    build:
      context: .
      dockerfile: docker/Dockerfile.services
    container_name: bhumi-supabase-indexer
    restart: unless-stopped
    command: ["node", "bhumi-supabase-indexer.js"]
    environment:
      - RPC_URL=http://besu-node:8545
      - CONTRACT_ABI_PATH=/app/contracts/LandRegistry.json
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON=${SUPABASE_ANON}
      - NEXT_PUBLIC_CONTRACT_ADDRESS=${CONTRACT_ADDRESS:-0x5FbDB2315678afecb367f032d93F642f64180aa3}
    depends_on:
      besu-node:
        condition: service_started
    profiles:
      - indexer
    networks:
      - bhumi-net

  # ═══════════════════════════════════════════════════════════
  #  DEPLOYER — Smart Contract Deploy (One-Shot)
  #  (Sekali saja: docker compose --profile deploy run deployer)
  # ═══════════════════════════════════════════════════════════
  deployer:
    build:
      context: .
      dockerfile: docker/Dockerfile.deployer
    container_name: bhumi-deployer
    environment:
      - RPC_URL=http://besu-node:8545
    depends_on:
      besu-node:
        condition: service_started
    profiles:
      - deploy
    networks:
      - bhumi-net

  # ─── NGROK (PUBLIC RPC TUNNEL) ──────────────────────────────────
  # Opsional: Untuk membuka RPC ke publik (diperlukan Vercel / Dosen)
  rpc-tunnel:
    image: ngrok/ngrok:latest
    container_name: bhumi-rpc-tunnel
    command: http besu-node:8545
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      besu-node:
        condition: service_started
    profiles:
      - tunnel
    networks:
      - bhumi-net

# ═══════════════════════════════════════════════════════════
#  VOLUMES — Persistent Data
# ═══════════════════════════════════════════════════════════
volumes:
  besu-data:
    name: bhumi-besu-data
  storage-data:
    name: bhumi-storage-data

# ═══════════════════════════════════════════════════════════
#  NETWORK
# ═══════════════════════════════════════════════════════════
networks:
  bhumi-net:
    driver: bridge
